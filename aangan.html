if(k=="thali")f=bw(62,64,28,a,1)+bw(140,64,25,b,1)+bw(56,140,22,"#d8c07a")+`<circle cx="140" cy="142" r="30" fill="#e6c380"/><circle cx="140" cy="142" r="30" fill="none" stroke="#c49a55" stroke-width="2" stroke-dasharray="3 5"/><ellipse cx="100" cy="104" rx="22" ry="15" fill="#fffaf0"/><circle cx="93" cy="101" r="2.5" fill="#e6dcc4"/><circle cx="106" cy="108" r="2.5" fill="#e6dcc4"/>`;
else if(k=="bowl")f=bw(100,96,56,a)+dots(9,44,"rgba(0,0,0,.18)",6)+dots(6,40,"#5f8f4a",2.5)+`<ellipse cx="148" cy="150" rx="28" ry="21" fill="#fffaf0"/><ellipse cx="148" cy="146" rx="22" ry="12" fill="${b}"/>`;
else if(k=="rice")f=`<ellipse cx="100" cy="108" rx="66" ry="54" fill="${a}"/><ellipse cx="86" cy="92" rx="34" ry="24" fill="#fff" opacity=".2"/>`+dots(16,54,b,4)+dots(10,50,"rgba(0,0,0,.14)",3)+bw(150,52,22,"#fffaf0")+`<circle cx="150" cy="52" r="10" fill="#e8d9a8"/>`;
else if(k=="flat")f=`<circle cx="84" cy="102" r="50" fill="${a}"/><circle cx="84" cy="102" r="50" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="3"/>${dots(10,40,"rgba(0,0,0,.14)",4)}<path d="M100 60a46 46 0 0 1 0 90z" fill="${a}" stroke="rgba(0,0,0,.18)" stroke-width="3"/>`+bw(152,52,22,b,1);
else if(k=="idli")f=[[66,96],[114,76],[104,124]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="27" fill="#e5dccb"/><circle cx="${x}" cy="${y-2}" r="25" fill="${a}"/><circle cx="${x-8}" cy="${y-9}" r="8" fill="#fff" opacity=".6"/>`).join("")+bw(150,150,32,b,1);
else f=[[64,70,-20],[112,60,15],[80,116,10],[128,112,-15]].map(([x,y,r])=>`<g transform="rotate(${r} ${x} ${y})"><rect x="${x-24}" y="${y-16}" width="48" height="32" rx="16" fill="${a}"/><rect x="${x-24}" y="${y-16}" width="48" height="32" rx="16" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="2"/>${dots(3,0,b,2)}</g>`).join("")+bw(150,150,26,b,1);
return`<svg viewBox="0 0 200 200" role="img" aria-label="Illustration of ${M[id].n}"><circle cx="100" cy="106" r="92" fill="#000" opacity=".12"/><circle cx="100" cy="100" r="90" fill="#fbf7ec"/><circle cx="100" cy="100" r="90" fill="none" stroke="#dccfb2" stroke-width="5"/><circle cx="100" cy="100" r="76" fill="none" stroke="#eadfc6" stroke-width="1.5"/>${f}</svg>`}
const mono=c=>c.n.split(" ").map(w=>w[0]).join("");
const S={v:"home",cook:null,cart:[],q:"",f:new Set(),area:"All areas",coupon:0,plan:{slots:new Set(["Lunch"]),days:30}};
const $=s=>document.querySelector(s),inr=n=>"₹"+Math.round(n);

const BG=["#f6e2c3","#dfe9d8","#f3d6c8","#f7ecc4"];

function mealCard(m){const c=C[m.c];return `<article class="card"><div class="pic" style="--bgc:${BG[m.id%4]}">${dish(m.id)}<span class="bd">🏡 Homemade</span></div><div class="bd2">

<button class="meta" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline" onclick="go('cook',${m.c})">by ${c.n}</button>
<div class="meta">${m.t} · ${c.km} km · ${m.d} min · ${stars(c.r)}</div>
<div class="row" style="margin-top:auto"><span class="price">${inr(m.p)}</span><button class="btn sm" onclick="add(${m.id})">Add to cart</button></div></div></article>`}
function cookCard(i){const c=C[i];return `<article class="card" style="padding:16px;gap:8px"><div class="pfh"><div class="avatar" aria-hidden="true">${mono(c)}</div><div><h3>${c.n}</h3><div class="meta">${c.a} · ${c.km} km</div></div></div>

<p style="font-size:.9rem">“${c.q}”</p><button class="btn alt sm" style="margin-top:auto" onclick="go('cook',${i})">Meet ${c.n.split(" ")[0]}</button></article>`}
function list(){let q=S.q.toLowerCase(),mx=(q.match(/(?:under|below|<)\s*₹?\s*(\d+)/)||[])[1];
const w=q.replace(/(under|below)\s*₹?\s*\d+|near me|home food|meals?|food/g,"").split(/\s+/).filter(Boolean),F=S.f,slots=["Breakfast","Lunch","Dinner"].filter(s=>F.has(s));
return M.filter(m=>{const c=C[m.c],h=(m.n+" "+m.g.join(" ")+" "+m.t+" "+c.n+" "+c.a+" "+c.c+" "+(m.v?"veg vegetarian":"non-veg")+" subscription").toLowerCase();
if(mx&&m.p>+mx)return 0;if(!w.every(x=>h.includes(x)))return 0;if(S.area!=="All areas"&&c.a!==S.area)return 0;
if(slots.length&&!slots.includes(m.t))return 0;if(F.has("Veg")&&!m.v)return 0;if(F.has("Non-veg")&&m.v)return 0;
for(const t of ["Jain","Healthy"])if(F.has(t)&&!m.g.includes(t))return 0;if(F.has("Budget")&&m.p>100)return 0;if(F.has("Top rated")&&c.r<4.8)return 0;return 1}).sort((a,b)=>C[a.c].km-C[b.c].km)}
function discover(){const ch=["Breakfast","Lunch","Dinner","Veg","Non-veg","Jain","Healthy","Budget","Top rated"];
return `<section class="view"><h2>Homemade meals near you</h2><p class="sub">Try “dal chawal”, “healthy lunch”, “punjabi” or “home food under ₹100”.</p>
${searchBar()}<div class="chips" role="group" aria-label="Filters">${ch.map(x=>`<button class="chip" aria-pressed="${S.f.has(x)}" onclick="tf('${x}')">${x}</button>`).join("")}</div>
<div id="res"></div></section>`}
function res(){const l=list();$("#res").innerHTML=l.length?`<p class="meta">${l.length} meals from ${new Set(l.map(m=>m.c)).size} home kitchens</p><div class="grid">${l.map(mealCard).join("")}</div>`:`<div class="empty"><div style="font-size:2.5rem">🍲</div><p><b>No meals match yet.</b></p><p>Clear a filter or pick “All areas”.</p><button class="btn sm" onclick="S.f.clear();S.q='';S.area='All areas';render()">Reset filters</button></div>`}
function tf(x){S.f.has(x)?S.f.delete(x):S.f.add(x);render()}
function searchBar(){return `<div class="search" role="search"><label class="sr" for="q" style="position:absolute;left:-9999px">Search meals</label><input id="q" type="search" placeholder="Search dal chawal, healthy lunch…" value="${S.q.replace(/"/g,"&quot;")}" oninput="S.q=this.value;if(S.v!=='discover'){}else res()" onkeydown="if(event.key==='Enter'&&S.v!=='discover')go('discover')">
<select aria-label="Area" onchange="S.area=this.value;if(S.v==='discover')res()">${AREAS.map(a=>`<option ${a===S.area?"selected":""}>${a}</option>`).join("")}</select>

function home(){const top=[...M].sort((a,b)=>C[b.c].r-C[a.c].r).slice(0,6);
return `<div class="view"><div class="hero"><div><h1>Ghar ka swaad, <span class="hl">ab aapke sheher mein.</span></h1>
<p class="sub" style="font-size:1.08rem">Discover fresh homemade meals prepared by local home cooks in Bhilai and delivered to your doorstep. Your next meal might come from a home just around the corner.</p>
<div class="cta"><button class="btn" onclick="go('discover')">Find Homemade Food</button><button class="btn alt" onclick="go('join')">Become a Home Cook</button></div></div>
<div class="thali">${dish(0)}<div class="fchip"><b>Sunita Aunty</b>Nehru Nagar · 1.2 km · ⭐ 4.9<br>Dal Chawal Thali, ₹90</div><div class="fchip f2">🏡 Cooked in a real home kitchen</div></div></div>
${searchBar()}
<div class="strip"><div><b>10</b>home kitchens</div><div><b>3,700+</b>meals served</div><div><b>from ₹60</b>a meal</div><div><b>6</b>areas in Bhilai–Durg</div></div><section><h2>Missing ghar ka khana?</h2><p class="sub">Because sometimes you don't need a restaurant. You need home.</p>
<div class="steps">${[["🎓","Living away from home?","Hostel and PG meals from ₹70 a thali."],["💼","Busy day at work?","Lunch that arrives on time, every weekday."],["🏭","Long shift ahead?","Filling, honest meals for factory and site workers."],["👵","Cooking for one?","Small portions and light food for seniors."]].map(x=>`<div class="step"><div class="ic">${x[0]}</div><h3>${x[1]}</h3><p class="meta">${x[2]}</p></div>`).join("")}</div></section>
<section><h2>Today's homemade meals</h2><div class="grid">${top.map(mealCard).join("")}</div></section>
<section><h2>How it works</h2><div class="two"><div><h3>For customers</h3><div class="steps">${["Discover a home cook","Choose your meal","Place your order","Enjoy homemade food"].map((t,i)=>`<div class="step"><b style="color:var(--terra)">${i+1}</b> ${t}</div>`).join("")}</div></div>
<div><h3>For home cooks</h3><div class="steps">${["Create your profile","Add your menu","Accept orders","Cook and earn"].map((t,i)=>`<div class="step"><b style="color:var(--sageD)">${i+1}</b> ${t}</div>`).join("")}</div></div></div></section>
<section><h2>Meet your neighbourhood cooks</h2><div class="grid">${[0,1,3,8].map(cookCard).join("")}</div></section>
<section><h2>More than a meal</h2><p class="sub">Customers get homemade food. Homemakers get an income. The community gets affordable local food.</p><div class="two" style="margin-top:16px">
<div class="story"><b>Stories from our kitchens</b><q>“From cooking for her family to serving 40 meals a day.”</q><span class="meta" style="color:#4a4238">Meet Meena, Supela</span></div>
<div class="story"><b>What customers say</b>${REV.map(r=>`<q style="font-size:.92rem">“${r[1]}” <span class="meta" style="color:#4a4238">— ${r[0]}</span></q>`).join("")}</div></div></section>
<section><div class="band"><h2>Turn your cooking into an opportunity.</h2><p>Earn from home, set your own menu and hours, and reach customers nearby. Manage everything from one dashboard.</p><button class="btn" onclick="go('join')" style="margin-top:12px">Become a Home Cook</button></div></section>
<section><h2>Trust and safety</h2><div class="steps">${[["✔","Verified kitchens","Every kitchen is reviewed before it goes live."],["🪪","Identity checked","Cooks verify identity and address."],["🧼","Hygiene standards","Clean utensils, covered food, fresh packing."],["⭐","Detailed reviews","Rate taste, quality, packaging, portion and timing."]].map(x=>`<div class="step"><div class="ic">${x[0]}</div><h3>${x[1]}</h3><p class="meta">${x[2]}</p></div>`).join("")}</div></section>
<section><h2>Questions</h2>${[["Which areas do you serve?","Nehru Nagar, Supela, Civic Centre, Risali, Bhilai Nagar and Durg, with more cities to follow."],["Can I pause a subscription?","Yes. Skip a day, pause, or change your meal from your dashboard."],["How is payment handled?","UPI, cards, wallets and cash on delivery where available."]].map(x=>`<details><summary>${x[0]}</summary><p class="meta">${x[1]}</p></details>`).join("")}</section></div>`}
function cookPage(){const i=S.cook,c=C[i],ms=M.filter(m=>m.c===i);
return `<section class="view"><button class="btn alt sm" onclick="go('discover')">← Back</button>
<div class="cover" role="img" aria-label="Decorative pattern"></div><div class="pfh" style="margin:0 0 18px;padding:0 20px"><div class="avatar" style="width:90px;height:90px;font-size:2.8rem" aria-hidden="true">${mono(c)}</div><div><h1 style="font-size:2rem">Meet ${c.n}</h1><p class="meta">${c.a}, Bhilai · ${c.c}</p>
<span class="tag" style="background:var(--sage);color:#10240f">✔ Verified kitchen</span> <span class="tag">🧼 Hygiene badge</span></div></div>
<div><span class="stat"><b>${c.r} ⭐</b>rating</span><span class="stat"><b>${c.m}</b>meals served</span><span class="stat"><b>${c.y} yrs</b>cooking</span></div>
<div class="story" style="margin:18px 0"><b>Her story</b><q>“${c.q}”</q><span class="meta" style="color:#4a4238">Cooking isn't just what I do. It's how I care for people.</span></div>
<h2>Menu</h2><div class="grid">${ms.map(mealCard).join("")}</div>
<h2 style="margin-top:34px">What customers say</h2><div class="grid">${REV.map(r=>`<div class="card" style="padding:16px;gap:6px"><div class="row"><b>${r[0]}</b><span class="tag" style="background:var(--sage);color:#10240f">✔ Verified order</span></div><p style="font-size:.92rem">“${r[1]}”</p><div class="meta">Taste ⭐5 · Quality ⭐5 · Packaging ⭐4 · Portion ⭐5 · Timeliness ⭐5</div></div>`).join("")}</div><div style="margin-top:24px"><button class="btn" onclick="ordFrom(${i})">Order from this cook</button> <button class="btn alt" onclick="go('plans')">Subscribe to ${c.n.split(" ")[0]}'s meals</button></div></section>`}
function ordFrom(i){M.filter(m=>m.c===i).slice(0,1).forEach(m=>add(m.id));openCart()}
const PRICE={Breakfast:45,Lunch:80,Dinner:80};
function plans(){const p=S.plan,base=[...p.slots].reduce((a,s)=>a+PRICE[s],0),off=p.days===30?.12:.05,tot=base*p.days*(1-off);
return `<section class="view"><h2>Meal subscriptions</h2><p class="sub">Ghar ka khana every day. Skip a day, pause, change your meal or choose your preferred cook, any time.</p>
<h3 style="margin-top:18px">Which meals?</h3><div class="tw">${["Breakfast","Lunch","Dinner"].map(s=>`<button class="chip" aria-pressed="${p.slots.has(s)}" onclick="p2('${s}')">${s}</button>`).join("")}</div>
<h3>How long?</h3><div class="tw">${[[1,"Daily"],[7,"Weekly"],[30,"Monthly"]].map(d=>`<button class="chip" aria-pressed="${p.days===d[0]}" onclick="S.plan.days=${d[0]};render()">${d[1]} plan</button>`).join("")}</div>
<div class="plan pop" style="max-width:440px">${p.days===30?'<span class="tag">Best value: save 12%</span>':""}<h3 style="margin-top:6px">${p.days===30?"Monthly":p.days===7?"Weekly":"Daily"} Ghar Ka Khana</h3>
<p>${p.days} days × ${[...p.slots].join(" + ")||"pick a meal"}</p><div class="price" style="font-size:1.8rem">${p.slots.size?inr(p.days===1?base:tot):"—"}</div><p class="meta">${p.slots.size?inr((p.days===1?base:tot)/p.days/p.slots.size)+" per meal":""}</p>

<button class="btn" ${p.slots.size?"":"disabled"} onclick="toast('Subscription request sent to your cook. Payment step comes next.')">Start plan</button></div></section>`}
function p2(s){const x=S.plan.slots;x.has(s)?x.delete(s):x.add(s);render()}
function join(){return `<section class="view"><h2>Turn your cooking into an opportunity.</h2><p class="sub">Earn from home. Decide your menu, hours and delivery area. We bring nearby customers.</p>

function verify(){const st=["Pending verification","Under review","Verified"];let i=0;const e=$("#vs");const draw=()=>e.innerHTML=`<h3 style="margin-top:22px">Verification status</h3><div class="tl">${st.map((s,j)=>`<span class="${j<=i?"on":""}">${s}</span>`).join("")}</div><p class="meta">Demo: statuses advance automatically. In production, admins review documents and photos of your kitchen.</p>`;draw();const t=setInterval(()=>{i++;draw();if(i>1)clearInterval(t)},1600)}
function add(id){const x=S.cart.find(i=>i.id===id);x?x.q++:S.cart.push({id,q:1});upd();toast(M[id].n+" added")}

function cart(){const sub=S.cart.reduce((a,i)=>a+M[i.id].p*i.q,0),dl=S.cart.length?CFG.delivery:0,pf=sub*CFG.platformPct,ds=sub*S.coupon,tot=sub+dl+pf-ds;

S.cart.map(i=>{const m=M[i.id];return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:flex-start"><div class="th">${dish(m.id)}</div><div><b>${m.n}</b><div class="meta">${C[m.c].n} · ${inr(m.p)}</div></div></div><div class="row"><button class="btn alt sm" aria-label="Remove one" onclick="chq(${m.id},-1)">−</button>${i.q}<button class="btn alt sm" aria-label="Add one" onclick="chq(${m.id},1)">+</button></div></div>`}).join("")+
`<label for="cp">Coupon (try GHAR10)</label><div class="row"><input class="f" id="cp"><button class="btn sm" onclick="coupon()">Apply</button></div>

$("#app").innerHTML={home,discover,cook:cookPage,plans,join}[S.v==="cook"?"cook":S.v]();if(S.v==="discover")res();document.title="Aangan — "+({home:"Ghar ka swaad, aapke sheher mein",discover:"Find homemade food in Bhilai",cook:C[S.cook||0].n,plans:"Meal subscriptions",join:"Become a home cook"})[S.v]}
